trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  containerRepository: web-guarda

stages:
  - stage: Test
    displayName: Test
    jobs:
      - job: BackendTests
        displayName: Backend tests
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: 22.x
            displayName: Use Node.js 22
          - script: npm ci
            workingDirectory: backend
            displayName: Install backend dependencies
          - script: npm test
            workingDirectory: backend
            displayName: Run API tests

  - stage: Quality
    displayName: Quality
    dependsOn: []
    jobs:
      - job: FrontendLint
        displayName: Frontend lint
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: 22.x
            displayName: Use Node.js 22
          - script: npm ci
            workingDirectory: frontend
            displayName: Install frontend dependencies
          - script: npm run lint
            workingDirectory: frontend
            displayName: Run ESLint

  - stage: Build
    displayName: Build
    dependsOn:
      - Test
      - Quality
    jobs:
      - job: BuildImage
        displayName: Build application image
        steps:
          - script: docker build --tag $(containerRepository):$(Build.SourceVersion) .
            displayName: Build Docker image

  - stage: Publish
    displayName: Publish
    dependsOn: Build
    condition: and(succeeded(), ne(variables['ACR_SERVICE_CONNECTION'], ''))
    jobs:
      - job: PublishImage
        displayName: Push image to Azure Container Registry
        steps:
          - task: Docker@2
            displayName: Build and push image
            inputs:
              command: buildAndPush
              containerRegistry: $(ACR_SERVICE_CONNECTION)
              repository: $(containerRepository)
              Dockerfile: Dockerfile
              buildContext: .
              tags: |
                $(Build.SourceVersion)
                latest

  - stage: Deploy
    displayName: Deploy
    dependsOn: Publish
    condition: and(succeeded(), eq(variables['DEPLOY_ENABLED'], 'true'), ne(variables['AZURE_SERVICE_CONNECTION'], ''), ne(variables['ACR_LOGIN_SERVER'], ''))
    jobs:
      - deployment: DeployContainerApp
        displayName: Update Azure Container App
        environment: web-guarda-production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: Deploy published image
                  inputs:
                    azureSubscription: $(AZURE_SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        --name "$(CONTAINER_APP_NAME)" \
                        --resource-group "$(AZURE_RESOURCE_GROUP)" \
                        --image "$(ACR_LOGIN_SERVER)/$(containerRepository):$(Build.SourceVersion)"
