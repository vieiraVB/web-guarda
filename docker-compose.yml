services:
  postgres:
    image: postgres:16
    container_name: web-guarda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: web_guarda
      POSTGRES_USER: web_guarda
      POSTGRES_PASSWORD: web_guarda_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: